limit_req_zone $binary_remote_addr zone=contact_api:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=commerce_api:10m rate=15r/m;
map $request_method $review_write_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $review_write_key zone=review_api:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    resolver ${NGINX_RESOLVER} valid=10s ipv6=off;
    set $backend_upstream "${BACKEND_HOST}:8000";

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32k;
    limit_req_status 429;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-src https://www.google.com https://www.tiktok.com" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /api/contact {
        limit_req zone=contact_api burst=3 nodelay;
        proxy_pass http://$backend_upstream;
        include /etc/nginx/proxy_params;
    }

    location = /api/checkout/session {
        limit_req zone=commerce_api burst=5 nodelay;
        proxy_pass http://$backend_upstream;
        include /etc/nginx/proxy_params;
    }

    location ^~ /api/checkout/session/ {
        limit_req zone=commerce_api burst=10 nodelay;
        proxy_pass http://$backend_upstream;
        include /etc/nginx/proxy_params;
    }

    location ~ ^/api/reviews/ {
        limit_req zone=review_api burst=5 nodelay;
        proxy_pass http://$backend_upstream;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        proxy_pass http://$backend_upstream;
        include /etc/nginx/proxy_params;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /images/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
