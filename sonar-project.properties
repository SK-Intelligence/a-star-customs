# SonarQube Community analysis for the Quality gate (.github/workflows/ci.yml, job "sonarqube").
sonar.projectKey=a-star-customs
sonar.projectName=A Star Customs
sonar.sourceEncoding=UTF-8

sonar.sources=frontend/src,backend/app,scripts
sonar.tests=backend/tests,frontend/e2e
# Catalogue data and media are content, not code.
sonar.exclusions=frontend/src/data/**,backend/app/*.json,scripts/*.json,**/*.png,**/*.jpg,**/*.jpeg,**/*.webp,**/*.mp4
# Unit coverage is measured on the FastAPI backend (pytest-cov, backend/.coveragerc); the
# storefront is covered by the Playwright suites and the scripts by their own CI runs instead.
sonar.coverage.exclusions=frontend/**,scripts/**
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.typescript.tsconfigPaths=frontend/tsconfig.app.json
