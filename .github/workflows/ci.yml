name: Quality gate

# Every job must pass before a change is merged or deployed. Free only: GitHub-hosted runners,
# open-source tools, and SonarQube Community in a throwaway container. See CONTRIBUTING.md.
# Feature branches are checked through their pull request (not twice); main runs on every push
# because Railway deploys production from it ("Wait for CI").
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The same majors as the production images: node:20-alpine (frontend/Dockerfile) and
  # python:3.12-slim (backend/Dockerfile).
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"
  CI: "1"

jobs:
  lint:
    name: Lint, types, forbidden text
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: npm ci
      # ESLint (frontend/eslint.config.js, zero warnings) and tsc -b (strict).
      - run: npm --workspace frontend run lint
      - run: npm run typecheck
      # Ruff (ruff.toml) on the backend and scripts; the version is pinned in backend/requirements.txt.
      - run: pip install -r backend/requirements.txt
      - run: ruff check backend scripts
      - run: ruff format --check backend scripts
      # Stripe/Web3Forms secrets or Hostinger URLs in the storefront source.
      - run: npm run check:text

  unit:
    name: Unit tests + coverage, catalog sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      # Fails below fail_under in backend/.coveragerc (the measured baseline, rounded down).
      - run: pytest -q --cov --cov-report=term --cov-report=xml
        working-directory: backend
      # Both catalogue and add-on copies identical, classification/fitment metadata, media SHA-256s.
      - run: python scripts/check_catalog_sync.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: coverage, path: backend/coverage.xml, retention-days: 14 }

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      # As Railway builds it (frontend/Dockerfile): no VITE_API_BASE_URL, /api on the same origin.
      - run: npm run build
      # The built bundle too: no provider secret or Hostinger URL may reach a customer's browser.
      - run: node scripts/check-forbidden-text.mjs frontend/dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: frontend-dist, path: frontend/dist, retention-days: 3 }

  e2e:
    name: E2E (desktop + mobile, production build)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: npm ci
      - run: pip install -r backend/requirements-runtime.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: frontend-dist, path: frontend/dist }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: pw-cache
        with: { path: ~/.cache/ms-playwright, key: "playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}" }
      - run: npx playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
      # The built bundle under `vite preview` with the FastAPI backend (frontend/playwright.config.ts).
      - run: npx playwright test --grep-invert @a11y
        working-directory: frontend
        env: { E2E_TARGET: prod }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with: { name: playwright-report, path: output/playwright, retention-days: 14 }

  accessibility:
    name: Accessibility (axe, 390 + 1440)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: npm ci
      - run: pip install -r backend/requirements-runtime.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: frontend-dist, path: frontend/dist }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: pw-cache
        with: { path: ~/.cache/ms-playwright, key: "playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}" }
      - run: npx playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
      # /, the C-Class product page, /shop, /contact-us and /checkout (with an item in the bag);
      # serious or critical fails.
      - run: npm run test:a11y
        working-directory: frontend
        env: { E2E_TARGET: prod }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with: { name: accessibility-report, path: output/playwright, retention-days: 14 }

  lighthouse:
    name: Lighthouse (/, C-Class product page, mobile)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: npm ci
        working-directory: .
      - run: pip install -r backend/requirements-runtime.txt
        working-directory: .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: frontend-dist, path: frontend/dist }
      # Budgets in frontend/lighthouserc.json (median of 3 runs): accessibility >= 0.95, best
      # practices >= 0.9, performance >= 0.8. With responsive WebP images (responsive-images.ts)
      # the local medians were 0.93 on / and 0.96 on the product page (LCP 3.2 s and 2.7 s,
      # 2026-10-04; 0.75 and 0.75 before). The budget stays well below them because runner
      # medians vary by several points. Uses the runner's preinstalled Chrome.
      - run: npx -y @lhci/cli@0.15.1 autorun
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: lighthouse, path: frontend/.lighthouseci, retention-days: 14, include-hidden-files: true }

  docker:
    name: Docker images (as Railway builds them)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      # Both build from the repository root; each runs scripts/check_catalog_sync.py first.
      - run: docker build -f backend/Dockerfile -t astar-backend:ci .
      - run: docker build -f frontend/Dockerfile -t astar-frontend:ci .

  ops-scripts:
    name: Ops scripts (ShellCheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      # The post-deploy smoke check and the pre-push hook (POSIX sh). ShellCheck is on the runner.
      - run: shellcheck --version && shellcheck --shell=sh ops/smoke-test.sh .githooks/pre-push

  security:
    name: Security (npm audit, pip-audit, gitleaks, Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      # Every dependency, dev included: the build and test tools run in CI and in the Railway build.
      # AUDIT_ALLOW lists advisories with no patched release that cannot be exploited here. Each
      # entry says why; remove it as soon as a fix ships. None today.
      - name: npm audit (high and critical)
        env: { AUDIT_ALLOW: "" }
        run: |
          npm audit --json > "$RUNNER_TEMP/audit.json" || true
          node scripts/check-audit.mjs "$RUNNER_TEMP/audit.json"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      # The backend's runtime and test requirements (any known vulnerability fails).
      - name: pip-audit
        run: |
          pip install --quiet pip-audit==2.10.1
          pip-audit --progress-spinner off -r backend/requirements.txt
      # The gitleaks binary (MIT) rather than gitleaks-action, which needs a paid licence for
      # organisation repositories. Scans the whole history with the repo's .gitleaks.toml.
      - name: gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          # SHA-256 from gitleaks_8.28.0_checksums.txt of the v8.28.0 release: refuse a changed download.
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --config .gitleaks.toml --exit-code 1 .
      - name: Semgrep OSS (fails on ERROR findings)
        run: |
          pip install --quiet semgrep==1.178.0
          semgrep scan --config p/typescript --config p/react --config p/python --config p/owasp-top-ten \
            --severity ERROR --error --metrics off --exclude "*.spec.ts" --exclude "tests" \
            frontend/src backend/app scripts

  sonarqube:
    name: SonarQube quality gate
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      sonarqube:
        image: sonarqube:community
        ports: ["9000:9000"]
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: coverage, path: backend }
      # coverage.py writes <source>app</source> (relative_files); the scanner runs from the
      # repository root, mounted at /usr/src in its container.
      - run: sed -i 's#<source>app</source>#<source>/usr/src/backend/app</source>#' backend/coverage.xml
      - name: Wait for SonarQube
        run: |
          for _ in $(seq 1 90); do
            status=$(curl -s http://localhost:9000/api/system/status | sed -n 's/.*"status":"\([A-Z_]*\)".*/\1/p')
            [ "$status" = "UP" ] && exit 0
            sleep 5
          done
          echo "SonarQube did not start"; exit 1
      # The container lives only for this job and is reachable only from this runner. Its
      # default admin password is replaced first, then used to set up the project and gate.
      - name: Project, quality gate and token
        shell: bash
        run: |
          set -euo pipefail
          PASS="Gate-$(openssl rand -hex 16)-A1"
          echo "::add-mask::$PASS"
          curl -sf -u admin:admin -X POST "http://localhost:9000/api/users/change_password" \
            --data-urlencode "login=admin" --data-urlencode "previousPassword=admin" --data-urlencode "password=$PASS"
          api() { curl -sf -u "admin:$PASS" -X POST "http://localhost:9000/api/$1" "${@:2}"; }
          api projects/create -d "project=a-star-customs" -d "name=A Star Customs" >/dev/null
          api qualitygates/create -d "name=A-Star" >/dev/null
          # Overall code: every run here is a first analysis, so "new code" conditions would pass vacuously.
          # Security A, maintainability A, reliability C or better, duplication 5% or less.
          api qualitygates/create_condition -d "gateName=A-Star" -d "metric=security_rating" -d "op=GT" -d "error=1" >/dev/null
          api qualitygates/create_condition -d "gateName=A-Star" -d "metric=sqale_rating" -d "op=GT" -d "error=1" >/dev/null
          api qualitygates/create_condition -d "gateName=A-Star" -d "metric=reliability_rating" -d "op=GT" -d "error=3" >/dev/null
          api qualitygates/create_condition -d "gateName=A-Star" -d "metric=duplicated_lines_density" -d "op=GT" -d "error=5" >/dev/null
          api qualitygates/select -d "gateName=A-Star" -d "projectKey=a-star-customs" >/dev/null
          TOKEN=$(api user_tokens/generate -d "name=ci" -d "type=PROJECT_ANALYSIS_TOKEN" -d "projectKey=a-star-customs" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          echo "::add-mask::$TOKEN"
          echo "SONAR_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "SONAR_ADMIN=$PASS" >> "$GITHUB_ENV"
      - name: sonar-scanner (waits for the quality gate)
        run: |
          docker run --rm --network host -e SONAR_HOST_URL=http://localhost:9000 -e SONAR_TOKEN \
            -v "$GITHUB_WORKSPACE:/usr/src" sonarsource/sonar-scanner-cli:11 \
            -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=600
      - name: Quality gate status
        if: always()
        run: |
          curl -s -u "admin:$SONAR_ADMIN" "http://localhost:9000/api/measures/component?component=a-star-customs&metricKeys=bugs,vulnerabilities,security_hotspots,code_smells,coverage,duplicated_lines_density,reliability_rating,security_rating,sqale_rating"
          echo
          echo "Bugs and vulnerabilities to review:"
          curl -s -u "admin:$SONAR_ADMIN" "http://localhost:9000/api/issues/search?componentKeys=a-star-customs&types=BUG,VULNERABILITY&ps=500" |
            jq -r '.issues[] | [.type, .severity, .component, (.line // ""), .message] | @tsv'
          status=$(curl -s -u "admin:$SONAR_ADMIN" "http://localhost:9000/api/qualitygates/project_status?projectKey=a-star-customs" | sed -n 's/.*"projectStatus":{"status":"\([A-Z_]*\)".*/\1/p')
          echo "Quality gate: $status"
          [ "$status" = "OK" ]
